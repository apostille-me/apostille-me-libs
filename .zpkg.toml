[package]
org = "apostille-me"
name = "apostille-me-libs"
version = "0.1.0"
description = "Shared libraries for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apostille-me-libs"

[install]
dir = ".vendor/.zed"

[dependencies]
"apostille-me/apme-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]
